name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: hookfixture --version
      - run: hookfixture build examples/invoice-events.json --out fixtures-out --copies 3 --order shuffle --seed 42
      - run: hookfixture verify fixtures-out/manifest.json
      - run: python examples/idempotent_consumer.py
