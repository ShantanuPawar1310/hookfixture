[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hookfixture"
version = "0.1.0"
description = "Deterministic local fixtures for duplicate and out-of-order webhook tests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Shantanu Pawar"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
hookfixture = "hookfixture.cli:main"

[project.urls]
Repository = "https://github.com/ShantanuPawar1310/hookfixture"
Issues = "https://github.com/ShantanuPawar1310/hookfixture/issues"

[tool.setuptools.packages.find]
where = ["src"]
